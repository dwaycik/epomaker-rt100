[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "epomaker-rt100"
version = "0.2.0"
description = "Control the Epomaker RT100 keyboard on Linux — screen, GIFs, backlight"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["epomaker", "rt100", "keyboard", "rgb", "gtk4", "libadwaita", "tui"]
classifiers = [
    "Environment :: Console :: Curses",
    "Environment :: X11 Applications :: GTK",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
]

# The core needs no UI toolkit. Front ends are optional extras, so you install
# only the one you want:
#
#   pip install .[tui]    terminal, works over SSH and in a tty
#   pip install .[gtk]    desktop window
#   pip install .[all]    both
#
# EpomakerController is NOT listed. 0.0.9 has the GIF support and the relaxed
# hidapi pin but is unreleased, so it is installed from the commit recorded in
# .upstream-commit -- see README.md.
dependencies = [
    "hidapi>=0.15.0",
    "pillow",
    "psutil>=6.0.0",
    "numpy<2.0",
    "opencv-python-headless",
    "appdirs",
    "click",
    "python-dateutil",
]

[project.optional-dependencies]
tui = ["textual>=1.0"]
# PyGObject is deliberately absent: building it from PyPI needs the full
# GTK/GObject toolchain, and every target distro ships a working binding.
# Install python-gobject / python3-gi from your package manager and create the
# venv with --system-site-packages. See README.md.
gtk = []
all = ["epomaker-rt100[tui]"]

[project.scripts]
epomaker-rt100 = "epomaker_rt100.tui:main"
epomaker-rt100-gtk = "epomaker_rt100_gtk:main"

[tool.setuptools]
packages = ["epomaker_rt100"]
py-modules = ["epomaker_rt100_gtk"]
